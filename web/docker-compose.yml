services:
  web:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: web
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:8080
    networks:
      - ecommerce-network

networks:
  ecommerce-network:
    driver: bridge